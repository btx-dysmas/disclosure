<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disclosure · SEC filing research</title>
  <meta name="description" content="Search, read, compare and analyze SEC filings. Financial statements, segment revenue, risk factors and insider activity, straight from EDGAR.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before the first paint so the page never flashes the wrong one.
    try {
      var t = new URLSearchParams(location.search).get("theme") || JSON.parse(localStorage.getItem("disclosure:theme") || '"light"');
      if (t === "dark") document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <!-- Fetch the modules every first view needs in parallel instead of one import at a time. -->
  <link rel="modulepreload" href="/js/app.js">
  <link rel="modulepreload" href="/js/lib.js">
  <link rel="modulepreload" href="/js/views/home.js">
  <link rel="modulepreload" href="/js/views/company.js">
  <link rel="modulepreload" href="/js/views/overview.js">
  <link rel="modulepreload" href="/js/views/financials.js">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">Disclosure</a>
    <form class="omni" id="omni" autocomplete="off" role="search">
      <input id="q" name="q" type="search" placeholder="Ticker, company name or accession number" aria-label="Search companies and filings" spellcheck="false">
      <div class="suggest" id="suggest" hidden></div>
    </form>
    <nav class="topnav">
      <a href="#/" data-nav="home">Dashboard</a>
      <a href="#/workspace" data-nav="workspace">Workspace</a>
    </nav>
    <span class="session" id="session"></span>
    <button class="theme-btn" id="theme" type="button"></button>
  </header>
  <main id="view"></main>
  <footer class="foot">
    Data from SEC EDGAR, retrieved as filed. Not investment advice.
  </footer>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
