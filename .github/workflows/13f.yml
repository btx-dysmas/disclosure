# Refresh the 13F holdings database after each quarterly filing deadline (45 days after quarter end).
name: Refresh 13F data
on:
  schedule:
    - cron: "0 12 20 2,5,8,11 *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_13f.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/13f.db
          git diff --cached --quiet || git commit -m "Refresh 13F holdings" && git push
